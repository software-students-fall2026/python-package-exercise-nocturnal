name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deliver:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Install pipenv and Pipfile packages
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev
      - name: Set version from date
        run: |
          VERSION=$(date +%Y.%m.%d).${{ github.run_number }}
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          echo "version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Build package
        run: |
          pipenv install build
          pipenv run python -m build .
      - name: Check package with twine
        run: pipenv run twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Create Github release 
        env: 
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/* --target ${{ github.event.workflow_run.head_sha }} --title "v$VERSION" --generate-notes


