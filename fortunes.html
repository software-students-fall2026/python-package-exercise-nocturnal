<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Three Fortunes</title>
	<style>
		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			padding: 24px;
			display: grid;
			place-items: center;
		}

		main {
			width: 100%;
			max-width: 650px;
			min-height: 430px;
			padding: 48px;
			border: 1px solid;
			border-radius: 24px;
			box-shadow: 0 10px 30px #0002;
			position: relative;
			overflow: hidden;
		}

		main::before {
			content: "";
			position: absolute;
			width: 200px;
			height: 200px;
			right: -80px;
			top: -80px;
			border-radius: 50%;
			opacity: .4;
		}

		.top, h1, p, .rule, nav, .deco {
			position: relative;
		}

		.top {
			font: bold 16px;
			letter-spacing: 2px;
			text-transform: uppercase;
		}

		h1 {
			max-width: 450px;
			margin: 24px 0 16px;
			font-size: 48px;
			line-height: 1;
			font-weight: normal;
		}

		p {
			max-width: 470px;
			font-size: 20px;
			line-height: 1.6;
		}

		.rule {
			width: 60px;
			height: 3px;
			margin: 28px 0;
			border-radius: 4px;
		}

		.deco {
			position: absolute;
			right: 32px;
			top: 26px;
			font-size: 50px;
		}

		nav {
			display: flex;
			justify-content: space-between;
			margin-top: 32px;
		}

		button {
			padding: 10px 10px;
			border: 1px solid;
			border-radius: 20px;
			background: transparent;
			font: 14px;
            font-family: inherit;
			cursor: pointer;
		}

		button:disabled {
			opacity: .4;
			cursor: default;
		}
	</style>
</head>
<body>
    <main id="card">
        <div class="top" id="header"></div>
        <div class="rule"></div>
        <h1 id="fortune"></h1>
        <span class="deco" id="deco" aria-hidden="true"></span>
        <nav>
            <button id="back" onclick="show(-1)">&lt;</button>
            <button id="next" onclick="show(1)">&gt;</button>
        </nav>
    </main>

	<script>
		const cards = [{"header": "Yesterday's Fortune", "body": "Yesterday, a fresh idea helped you resonate. Remember that feeling when it appears again.", "page_color": "#f1f5d2", "card_color": "#f4d6d6", "heading_color": "#1C3258", "body_color": "#253c36", "font": "'Trebuchet MS', sans-serif", "corner_decoration": "\u2740", "border_color": "#1C3258"}, {"header": "Today's Fortune", "body": "Something powerful may arrive without warning. Be prepared to let that hopeful thing take root.", "page_color": "#c8def4", "card_color": "#ddf9f3", "heading_color": "#1C3258", "body_color": "#3d324d", "font": "Arial, sans-serif", "corner_decoration": "\u2749", "border_color": "#1C3258"}, {"header": "Tomorrow's Fortune", "body": "Tomorrow, be fresh if a complicated situation knocks. Something bright may spread if you take a risk.", "page_color": "#f4d6d6", "card_color": "#f1f5d2", "heading_color": "#363450", "body_color": "#2C3D31", "font": "Arial, sans-serif", "corner_decoration": "\u273a", "border_color": "#363450"}];
		let current = 0;

		function show(step = 0) {
			current += step;
			const c = cards[current];
			document.body.style.background = c.page_color;

			const card = document.querySelector("#card");
			card.style.background = c.card_color;
			card.style.borderColor = c.border_color;
			card.style.fontFamily = c.font;

			document.querySelector("#header").textContent = c.header;
			document.querySelector("#header").style.color = c.body_color;
			document.querySelector("#fortune").textContent = c.body;
			document.querySelector("#fortune").style.color = c.heading_color;
			document.querySelector(".rule").style.background = c.border_color;
			document.querySelector("#deco").textContent = c.corner_decoration;
			document.querySelector("#deco").style.color = c.border_color;
			document.querySelector("#back").disabled = current === 0;
			document.querySelector("#next").disabled = current === cards.length - 1;
		}

		show();
	</script>
</body>
</html>
