[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pynesthesia"
version = "0.1.0"
description = "A Python package developed by Team Nocturnal."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Christina Lin" },
    { name = "Daniel Zhang" },
    { name = "Jason Wang" },
    { name = "Rishi Ajoykumar" },
    { name = "Matthew Chen" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.urls]
Repository = "https://github.com/software-students-fall2026/python-package-exercise-nocturnal"
"Christina Lin" = "https://github.com/christinalin06"
"Daniel Zhang" = "https://github.com/danielzhang04"
"Jason Wang" = "https://github.com/TirpitzS128"
"Rishi Ajoykumar" = "https://github.com/ajoykumarrishi"
"Matthew Chen" = "https://github.com/23matthewc"